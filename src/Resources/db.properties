# URL de conexión JDBC.
# Oracle XE 21c usa el PDB XEPDB1 en el puerto 1521.
# Oracle 23c/26ai Free suele usar FREEPDB1, por eso se deja como referencia.
db.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
# Fallback opcional si se usa Oracle Database Free:
# db.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1

# Credenciales del esquema del proyecto
db.user=QUINDIOSTAY
db.password=Quindio123
